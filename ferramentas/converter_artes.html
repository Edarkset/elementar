<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Converter artes do Elementar</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #15111d; color: #f2e7c9; margin: 2rem; }
  progress { width: 100%; height: 18px; }
  #log { font: 12px monospace; white-space: pre-wrap; max-height: 60vh; overflow: auto; color: #c9bfa8; }
  .erro { color: #ff8a7a; }
</style>
</head>
<body>
<h1>Converter artes</h1>
<p id="estado">Carregando lista…</p>
<progress id="barra" value="0" max="1"></progress>
<div id="log"></div>
<script>
// Para cada arte: baixa o PNG original, reduz para o tamanho do jogo com filtro de alta qualidade
// e devolve o WebP para o PowerShell gravar no repositório.
const estado = document.getElementById("estado"), barra = document.getElementById("barra"), log = document.getElementById("log");
function escrever(txt, erro) { const d = document.createElement("div"); d.textContent = txt; if (erro) d.className = "erro"; log.prepend(d); }

// faixa vertical da folha que tem desenho (alfa > 60), com 8 px de folga
function faixaComDesenho(bmp) {
  const k = 4, w = Math.ceil(bmp.width / k), h = Math.ceil(bmp.height / k), c = new OffscreenCanvas(w, h), g = c.getContext("2d");
  g.drawImage(bmp, 0, 0, w, h); const d = g.getImageData(0, 0, w, h).data; let y0 = h, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 60) { if (y < y0) y0 = y; y1 = y; break; }
  if (y1 < 0) return { y: 0, h: bmp.height };
  const a = Math.max(0, y0 * k - 8), b = Math.min(bmp.height, (y1 + 1) * k + 8); return { y: a, h: b - a };
}
// efeitos: cada quadro da folha (coluna) vira um quadrado da tira, na mesma escala e sem achatar
function montarTira(bmp, t, g) {
  const cw = bmp.width / t.cols, f = faixaComDesenho(bmp), lado = Math.max(cw, f.h), S = t.h, k = S / lado;
  g.imageSmoothingQuality = "high";
  for (let c = 0; c < t.cols; c++)
    g.drawImage(bmp, c * cw, f.y, cw, f.h, c * S + (lado - cw) / 2 * k, (lado - f.h) / 2 * k, cw * k, f.h * k);
}

async function converter(t) {
  const png = await (await fetch(`/origem/${t.i}`)).blob();
  const tela = new OffscreenCanvas(t.w, t.h), g = tela.getContext("2d");
  if (t.cols) { const bmp = await createImageBitmap(png, { premultiplyAlpha: "none" }); montarTira(bmp, t, g); bmp.close(); }
  else { const bmp = await createImageBitmap(png, { resizeWidth: t.w, resizeHeight: t.h, resizeQuality: "high", premultiplyAlpha: "none" }); g.drawImage(bmp, 0, 0); bmp.close(); }
  const webp = await tela.convertToBlob({ type: "image/webp", quality: t.q });
  if (webp.type !== "image/webp") throw new Error("este navegador não gera WebP");
  const r = await fetch(`/salvar/${t.i}`, { method: "POST", body: webp });
  if (!r.ok) throw new Error(await r.text());
  return webp.size;
}

(async () => {
  const tarefas = await (await fetch("/tarefas")).json();
  barra.max = tarefas.length; let feitos = 0, erros = 0, total = 0, prox = 0;
  async function trabalhador() {
    while (prox < tarefas.length) {
      const t = tarefas[prox++];
      try { const n = await converter(t); total += n; escrever(`${t.rel} → ${t.w}x${t.h} ${(n / 1024).toFixed(0)} KB`); }
      catch (e) { erros++; escrever(`${t.rel}: ${e.message}`, true); }
      feitos++; barra.value = feitos; estado.textContent = `${feitos}/${tarefas.length} (${(total / 1048576).toFixed(1)} MB${erros ? `, ${erros} com erro` : ""})`;
    }
  }
  await Promise.all([trabalhador(), trabalhador(), trabalhador(), trabalhador()]);
  const fim = await (await fetch("/fim")).text();
  estado.textContent = `Pronto: ${fim}. Total ${(total / 1048576).toFixed(1)} MB${erros ? `, ${erros} com erro` : ""}.`;
  document.title = "PRONTO - " + document.title;
})().catch(e => { estado.textContent = "Erro: " + e.message; estado.className = "erro"; });
</script>
</body>
</html>
