<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Elementar</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elementar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120f1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="app/icones/favicon-32.png">
<link rel="apple-touch-icon" href="app/icones/apple-touch-icon.png">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div id="jogo">
  <canvas id="tela"></canvas>
  <div class="hud-topo" id="hud">
    <div class="linha"><span class="lugar" id="lugar"></span><span class="ess-hud" id="essHud" aria-label="Essência da run">0</span><span class="tempo" id="tempo">0:00</span>
      <button class="btn-hud" id="btnBolsa">Bolsa</button><button class="btn-hud" id="btnPausa" aria-label="Pausar">II</button></div>
    <div class="barra vida" aria-label="Vida da equipe"><i id="barVida"></i><b id="barEscudo"></b></div>
    <div class="barra xp" aria-label="Experiência"><i id="barXp"></i></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="combo" id="combo"></div>
  <div class="nivel-pop" id="nivelPop" aria-live="polite"></div>
  <div class="hud-base" id="hudBase">
    <div class="coluna-esq"><div class="ninho" id="ninho"></div><div class="equipe" id="equipe"></div></div>
    <div class="botoes-dir">
      <button class="circ esq comb" id="btnComb" aria-label="Especial combinado"><i id="combFill"></i><span id="combNome">Combo</span></button>
      <button class="circ esq" id="btnEsq" aria-label="Esquiva"><i id="esqFill"></i><span>Esquiva</span></button>
      <button class="circ ult" id="btnUlt" aria-label="Despertar Elemental"><i id="ultFill"></i><span>Despertar</span></button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="tela ativa" id="telaMenu"><div class="painel"><div class="rolagem">
    <h1>Elementar</h1>
    <p>Feche um Pacto com os elementos, choque ovos, capture filhotes e leve seus monstros mitológicos o mais fundo que conseguir.</p>
    <div class="meta"><span id="metaEss"></span><span id="metaProf"></span><span id="metaCol"></span></div>
    <div id="menuBotoes"></div>
    <p style="margin-top:14px">Arraste o dedo para andar (ou W, A, S, D). Esquiva: botão, Shift ou toque duplo. Despertar: botão ou espaço.</p>
  </div></div></div>
  <div class="tela" id="telaCartas"><div class="painel"><div class="rolagem"><h2 id="cartasTitulo"></h2><p id="cartasSub"></p><div class="cartas" id="cartas"></div><div id="cartasRodape"></div></div></div></div>
</div>
<script src="js/plataforma.js"></script>
<script src="js/dados.js"></script>
<script src="js/jogo/01_nucleo.js"></script>
<script src="js/jogo/02_combate.js"></script>
<script src="js/jogo/03_progressao.js"></script>
<script src="js/jogo/04_ambiente.js"></script>
<script src="js/jogo/05_arte.js"></script>
<script src="js/jogo/06_loop.js"></script>
<script src="js/jogo/07_cenario.js"></script>
<script src="js/jogo/08_sistemas.js"></script>
<script src="js/jogo/09_criaturas.js"></script>
<script src="js/jogo/10_desenho.js"></script>
<script src="js/jogo/11_menu.js"></script>
<script src="js/app.js"></script>
</body>
</html>
